name: Web and Worker checks
on:
  push:
    paths: ['web/**', 'worker/**', 'shared/**', 'tests/**', 'package*.json', 'wrangler.jsonc', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'worker/**', 'shared/**', 'tests/**', 'package*.json', 'wrangler.jsonc', '.github/workflows/web.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm test
      - run: npm run build
      - run: web/node_modules/.bin/tsc -p worker/tsconfig.json
      - run: npx wrangler deploy --dry-run
