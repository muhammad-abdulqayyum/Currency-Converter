name: iOS build and simulator checks
on:
  push:
    branches: [master, develop]
    paths: ['ios/**', 'scripts/ios_simulator_check.py', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'scripts/ios_simulator_check.py', '.github/workflows/ios.yml']
  workflow_dispatch:
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode 26 or newer
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          apps=[]
          for p in pathlib.Path('/Applications').glob('Xcode*.app'):
              v=subprocess.check_output([str(p/'Contents/Developer/usr/bin/xcodebuild'),'-version'],text=True)
              m=re.search(r'Xcode (\d+(?:\.\d+)*)',v)
              if m and int(m[1].split('.')[0])>=26: apps.append((tuple(map(int,m[1].split('.'))),p))
          if not apps: raise SystemExit('Xcode 26+ is required; update the runner image.')
          p=max(apps,key=lambda x:x[0])[1]
          subprocess.run(['sudo','xcode-select','-s',str(p/'Contents/Developer')],check=True)
          PY
          xcodebuild -version
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Test decimal conversion, catalog, dates and cache policy
        run: swift test --package-path ios
      - name: Build iPhone and iPad simulator app
        run: python3 scripts/ios_simulator_check.py --build-only
      - name: Compile unsigned device Release
        run: |
          mkdir -p ios/build
          if ! xcodebuild -project ios/UniversalCurrencyConverter.xcodeproj -scheme UniversalCurrencyConverter -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ios/build/device CODE_SIGNING_ALLOWED=NO build > ios/build/device-build.log 2>&1; then
            tail -n 150 ios/build/device-build.log
            exit 1
          fi
      - name: Run iPhone and iPad interface tests
        run: python3 scripts/ios_simulator_check.py --test-only
      - name: Package simulator app with executable permissions
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ios/build/simulator/Build/Products/Debug-iphonesimulator/UniversalCurrencyConverter.app \
            ios/build/Universal-Currency-Converter-iOS-Simulator.zip
          python3 - <<'PYCODE'
          import pathlib, zipfile
          archive = pathlib.Path('ios/build/Universal-Currency-Converter-iOS-Simulator.zip')
          with zipfile.ZipFile(archive) as bundle:
              binary = bundle.getinfo('UniversalCurrencyConverter.app/UniversalCurrencyConverter')
              if not (binary.external_attr >> 16) & 0o111:
                  raise SystemExit('Simulator archive lost executable permissions')
          PYCODE
      - name: Upload simulator app, screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Currency-Converter-iOS-Simulator
          retention-days: 14
          path: |
            ios/build/Universal-Currency-Converter-iOS-Simulator.zip
            ios/build/*.png
            ios/build/*.json
            ios/build/*.log
            ios/build/*.xcresult
            ios/UniversalCurrencyConverter.xcodeproj
