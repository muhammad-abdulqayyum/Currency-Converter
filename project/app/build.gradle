plugins { id 'com.android.application' }
android {
    namespace 'com.example.muhammad.usd_converter'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.muhammad.usd_converter'
        minSdk 23
        targetSdk 35
        versionCode 48
        versionName '4.0.7'
    }
    sourceSets.main.assets.srcDir("../../shared/countries")
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
